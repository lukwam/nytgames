[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nytgames"
dynamic = ["version"]
description = "Unofficial client for the New York Times Games APIs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lukas Karlsson", email = "lukwam@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
    "requests>=2.32",
]

[project.optional-dependencies]
api = ["fastapi>=0.111"]
test = ["httpx", "pytest"]

[project.urls]
Homepage = "https://github.com/lukwam/nytgames"

[tool.setuptools.packages.find]
include = ["nytgames*"]

[tool.setuptools.dynamic]
version = { attr = "nytgames.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]
